
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --cors-allowed-origins "*"
      --allowed-hosts "localhost:*,127.0.0.1:*,host.docker.internal:*,mlflow:*"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12


  api:
    build: .
    image: godefrey/projekt-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_URI: http://mlflow:5000
      DATABASE_URL: postgresql://mlflow:${POSTGRES_PASSWORD}@db:5432/mlflow
    depends_on:
      mlflow:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mlflow-data:
    external: true
  postgres-data: